<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Study — a quiet chat with Claude</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>

  <div class="room">
    <header class="room-header">
      <div class="mark">
        <span class="mark-dot" id="statusDot" aria-hidden="true"></span>
        <span class="mark-text">Study</span>
      </div>
      <div class="header-right">
        <span class="model-tag" id="modelTag">claude-sonnet-4-6</span>
        <button class="icon-btn" id="clearBtn" title="Clear conversation" aria-label="Clear conversation">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 4H14M6.5 4V2.5C6.5 2.22386 6.72386 2 7 2H9C9.27614 2 9.5 2.22386 9.5 2.5V4M12.5 4L12 13C12 13.5523 11.5523 14 11 14H5C4.44772 14 4 13.5523 4 13L3.5 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <main class="thread" id="thread">
      <div class="welcome" id="welcome">
        <p class="welcome-eyebrow">an open page, waiting</p>
        <h1>What's on your mind?</h1>
        <p class="welcome-sub">Ask a question, think something through, or just start typing. This runs on Claude, kept behind a small server so no key ever touches your browser.</p>
      </div>
    </main>

    <form class="composer" id="composerForm">
      <textarea
        id="input"
        class="composer-input"
        placeholder="Write here…"
        rows="1"
        autofocus
      ></textarea>
      <button type="submit" class="send-btn" id="sendBtn" aria-label="Send message">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 9H16M16 9L10 3M16 9L10 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>
    <p class="composer-hint">Enter to send · Shift + Enter for a new line</p>
  </div>

<script src="assets/script.js"></script>
</body>
</html>
